name: Release

on:
  # Release on push to main
  # push:
    # branches: [main]
  # Release on manual trigger
  workflow_dispatch:

# Required for npm Trusted Publishing (OIDC). Do not pass NPM_TOKEN to
# `npm publish` — a token with 2FA enabled causes EOTP in CI.
permissions:
  id-token: write
  contents: read

jobs:
  release_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Prevent the action from storing credentials in a way that's hard to override
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Do not set registry-url here. It writes an .npmrc auth token that
          # blocks OIDC trusted publishing if NODE_AUTH_TOKEN is empty.

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      # Set the name, email, and URL with PAT
      - name: Set git credentials
        run: |
          git config user.name "SCAYLE"
          git config user.email "${{ vars.REPO_USER_EMAIL }}"
          git remote set-url origin "https://$REPO_PAT@github.com/scayle/panel-icons"
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}

      - name: Publish
        run: npm run release
